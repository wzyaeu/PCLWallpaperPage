name: 更新页面

on:
  schedule:
    - cron: "0 7 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-and-deploy:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run main.py
        run: python main.py

      - name: Push output to pagedata branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 基于产物重建 pagedata 分支（每次仅保留一个提交）
          git checkout --orphan pagedata
          git rm -rf --cached . > /dev/null 2>&1 || true

          # 仅提交产物目录与 Worker 配置
          git commit -m "更新页面"

          # 强制推送，确保远端产物分支与本次产物一致
          git push --force origin pagedata